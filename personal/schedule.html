<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Weekly Schedule</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #94edff;
      --text: #000000;
      --muted: #64748b;
      --line: #e2e8f0;
      --card: #ffffff60;
      --class-bg: #dbeafe;
      --class-bd: #2563eb;
      --class-fg: #1e3a8a;
      --job-bg: #dcfce7;
      --job-bd: #16a34a;
      --job-fg: #14532d;
      --shift-bg: #ffedd5;
      --shift-bd: #ea580c;
      --shift-fg: #7c2d12;
      --meal-bg: #fef9c3;
      --meal-bd: #ca8a04;
      --meal-fg: #713f12;
      --flex-bg: #ede9fe;
      --flex-bd: #7c3aed;
      --flex-fg: #4c1d95;
      --free-bg: #ccfbf1;
      --free-bd: #0d9488;
      --free-fg: #134e4a;
      --base-bg: #f1f5f9;
      --base-bd: #94a3b8;
      --base-fg: #334155;
      --club-bg: #fee2e2;
      --club-bd: #b91c1c;
      --club-fg: #450a0a;
      --appt-bg: #fdf2f8;
      --appt-bd: #ec4899;
      --appt-fg: #831843;
      --studio-bg: #dbeafe;
      --studio-bd: #2563eb;
      --studio-fg: #1e3a8a;
    }

    body.dark {
      --bg: #240038;
      --text: #ffffff;
      --muted: #94a3b8;
      --line: #263248;
      --card: #a78aff60;
      --class-bg: #1e2f5c;
      --class-bd: #60a5fa;
      --class-fg: #dbeafe;
      --job-bg: #14401f;
      --job-bd: #4ade80;
      --job-fg: #dcfce7;
      --shift-bg: #4a2410;
      --shift-bd: #fb923c;
      --shift-fg: #ffedd5;
      --meal-bg: #46390c;
      --meal-bd: #facc15;
      --meal-fg: #fef9c3;
      --flex-bg: #2e2358;
      --flex-bd: #a78bfa;
      --flex-fg: #ede9fe;
      --free-bg: #0f3b38;
      --free-bd: #2dd4bf;
      --free-fg: #ccfbf1;
      --base-bg: #1f2937;
      --base-bd: #64748b;
      --base-fg: #e2e8f0;
      --club-bg: #4b0d1f;
      --club-bd: #f87171;
      --club-fg: #fee2e2;
      --appt-bg: #4b1232;
      --appt-bd: #f472b6;
      --appt-fg: #fdf2f8;
      --studio-bg: #1e3a8a;
      --studio-bd: #60a5fa;
      --studio-fg: #dbeafe;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Lato', sans-serif;
      padding: 20px 14px 32px
    }

    main {
      max-width: 1100px;
      margin: 0 auto
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 4px
    }

    .sub {
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      padding-top: 16px;
      margin: 0 0 14px;
      text-align: center
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px
    }

    .chip {
      font-size: .78rem;
      padding: 3px 10px;
      border-radius: 99px;
      border-left: 4px solid;
      font-weight: 600
    }

    .wrap {
      overflow-x: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 5px
    }

    .mobile-schedule {
      display: none
    }

    .mobile-days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
      margin-bottom: 14px
    }

    .mobile-days button {
      box-sizing: border-box;
      width: 100%;
      min-height: 44px;
      margin: 0;
      padding: 8px 2px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--card);
      color: var(--text);
      font-size: .82rem;
      font-weight: 700
    }

    .mobile-days button[aria-selected="true"] {
      border-color: #7c3aed;
      background: #ede9fe;
      color: #4c1d95
    }

    .mobile-days button.is-current,
    .hd.is-current {
      border-color: var(--line);
      background: var(--card);
      color: var(--text)
    }

    body.dark .mobile-days button[aria-selected="true"],
    body.dark .mobile-days button.is-current,
    body.dark .hd.is-current {
      border-color: var(--line);
      background: var(--card);
      color: var(--text)
    }

    .mobile-day-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 10px
    }

    .mobile-day-heading h2 {
      margin: 0
    }

    .mobile-day-heading span {
      color: var(--muted);
      font-size: .82rem
    }

    .mobile-events {
      display: grid;
      gap: 8px
    }

    .mobile-event {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      min-height: 54px;
      padding: 9px 10px;
      border-left: 4px solid var(--event-border);
      border-radius: 4px;
      background: var(--event-bg);
      color: var(--event-fg)
    }

    .mobile-event-time {
      font-size: .78rem;
      font-weight: 700;
      line-height: 1.35
    }

    .mobile-event-name {
      display: block;
      font-size: .95rem;
      line-height: 1.3
    }

    .mobile-event-category {
      display: block;
      margin-top: 2px;
      font-size: .75rem;
      opacity: .8
    }

    .grid {
      display: grid;
      grid-template-columns: 52px repeat(7, minmax(104px, 1fr));
      min-width: 820px
    }

    .hd {
      position: sticky;
      top: 0;
      text-align: center;
      font-weight: 700;
      font-size: .85rem;
      padding: 10px 4px;
      border-bottom: 1px solid var(--line);
      background: var(--card)
    }

    .hd.is-current {
      border-color: var(--line);
      background: var(--card)
    }

    .times {
      position: relative
    }

    .times span {
      position: absolute;
      right: 6px;
      font-size: .68rem;
      color: var(--muted);
      transform: translateY(-50%)
    }

    .times span:first-child {
      transform: translateY(0)
    }

    .col {
      position: relative;
      border-left: 1px solid var(--line);
      background-image: repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent 48px)
    }

    .ev {
      position: absolute;
      left: 3px;
      right: 3px;
      border-left: 4px solid;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: .72rem;
      line-height: 1.25;
      overflow: hidden;
      box-sizing: border-box
    }

    .ev b {
      display: block;
      font-size: .76rem
    }

    .ev i {
      font-style: normal;
      opacity: .8;
      font-size: .66rem
    }

    .note {
      color: var(--muted);
      font-size: .82rem;
      margin-top: 12px
    }

    @media (max-width: 600px) {
      body {
        padding: 16px 10px 24px
      }

      h1 {
        font-size: 1.35rem
      }

      .sub {
        line-height: 1.5
      }

      .legend {
        gap: 6px
      }

      .chip {
        font-size: .72rem;
        padding: 3px 8px
      }

      .wrap {
        display: none
      }

      .mobile-schedule {
        display: block
      }
    }
  </style>
</head>

<body>
  <a href="https://www.jstaed.me" class="homeButton" aria-label="Home"><i class="fa-sharp-duotone fa-solid fa-house" aria-hidden="true"></i></a>
  <button id="toggleDark" class="darkModeButton"><i class="fa-solid fa-sun"></i></button>
  <main>
    <h1>Weekly Schedule</h1>
    <p class="sub" id="scheduleSummary"></p>
    <div class="legend" id="legend"></div>
    <div class="mobile-schedule">
      <div class="mobile-days" id="mobileDays" role="tablist" aria-label="Choose a day"></div>
      <section id="mobileDayView" role="tabpanel" tabindex="0">
        <div class="mobile-day-heading">
          <h2 id="mobileDayHeading"></h2>
          <span id="mobileEventCount"></span>
        </div>
        <div class="mobile-events" id="mobileEvents"></div>
      </section>
    </div>
    <div class="wrap">
      <div class="grid" id="grid"></div>
    </div>
  </main>
  <script>
    const H = 48, S = 360, E = 1350;
    const ev = (start, end, label, category) => ({ start, end, label, category });
    const m = s => { const [a, b] = s.split(":"); return +a * 60 + +b };
    const fmt = s => { let [a, b] = s.split(":"); a = +a; const p = a >= 12 ? "pm" : "am"; a = a % 12 || 12; return a + (b === "00" ? "" : ":" + b) + p };

    const weekdayBase = [
      ev("7:00", "8:00", "Morning routine", "base"),
      ev("8:00", "9:45", "Starbucks", "shift"),
      ev("10:00", "10:50", "Python", "class"),
      ev("12:00", "13:50", "Work / LTS", "job")
    ];

    const monWed = [
      ...weekdayBase,
      ev("15:00", "17:30", "Metalsmithing", "class"),
      ev("17:30", "18:30", "Dinner", "meal")
    ];

    const wed = [
      ...monWed,
      ev("19:00", "21:00", "Metals Studio", "studio")
    ];

    const fri = [
      ...weekdayBase,
      ev("14:00", "15:00", "Therapy", "appt"),
      ev("16:30", "17:30", "COGS", "club"),
      ev("17:30", "18:30", "Dinner", "meal")
    ];

    const tue = [
      ev("7:00", "8:00", "Morning routine", "base"),
      ev("8:15", "10:45", "Wood Furniture", "class"),
      ev("11:00", "12:30", "LTS", "job"),
      ev("12:30", "13:45", "Work / LTS", "job"),
      ev("17:30", "18:30", "Dinner", "meal")
    ];

    const th = [
      ev("7:00", "8:00", "Morning routine", "base"),
      ev("8:15", "10:45", "Wood Furniture", "class"),
      ev("11:00", "12:30", "LTS", "job"),
      ev("12:30", "13:45", "Work / LTS", "job"),
      ev("14:00", "15:00", "Therapy", "appt"),
      ev("17:30", "18:30", "Dinner", "meal")
    ];

    const sat = [
      ev("7:00", "8:00", "Morning routine", "base"),
      ev("10:00", "11:00", "Starbucks", "shift"),
      ev("15:00", "17:00", "Metals Studio", "studio"),
      ev("17:30", "18:30", "Dinner", "meal"),
      ev("19:00", "21:00", "Metals Studio", "studio")
    ];

    const sun = [
      ev("7:00", "8:00", "Morning routine", "base"),
      ev("10:00", "11:30", "Brunch", "meal"),
      ev("17:30", "18:30", "Dinner", "meal")
    ];

    const schedule = { Sun: sun, Mon: monWed, Tue: tue, Wed: wed, Thu: th, Fri: fri, Sat: sat };
    const dayOrder = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const days = dayOrder.map(day => [day, schedule[day]]);
    const cats = { class: "Classes", job: "Work", shift: "Starbucks", meal: "Meals", flex: "Flex / homework", free: "Free time", base: "Routine", club: "Club", appt: "Appointments", studio: "Studio time" };
    const dayLabels = { Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", Sat: "Saturday", Sun: "Sunday" };
    const easternNow = new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));
    const currentDay = dayOrder[easternNow.getDay()];
    const currentIndex = dayOrder.indexOf(currentDay);

    const workEntries = Object.values(schedule)
      .flat()
      .filter(event => event.category === "job");
    
    const ltsEntries = Object.values(schedule)
      .flat()
      .filter(event => event.label.includes("LTS"));

    const workMinutes = workEntries.reduce((total, event) => total + (m(event.end) - m(event.start)), 0);
    const ltsMinutes = 30 + ltsEntries.reduce((total, event) => total + (m(event.end) - m(event.start)), 0);
    const pay = ((workMinutes / 60) * 125 * 0.7) + (((ltsMinutes) / 60) * 11 * 0.95);
    const hoursText = minutes => (minutes / 60).toFixed(1).replace(/\.0$/, "");
    const summary = document.getElementById("scheduleSummary");
    summary.textContent = `Wake 7:00am · Bed 11:00pm · Work ${hoursText(workMinutes)} Hours · ${hoursText(ltsMinutes)} LTS Hours · Estimated Pay $${pay.toFixed(2)}`;

    document.getElementById("legend").innerHTML = Object.entries(cats).filter(([k]) => !["flex", "free"].includes(k)).map(([k, v]) => `<span class="chip" style="background:var(--${k}-bg);border-color:var(--${k}-bd);color:var(--${k}-fg)">${v}</span>`).join("");

    const mobileDays = document.getElementById("mobileDays");
    const mobileDayView = document.getElementById("mobileDayView");
    const mobileDayHeading = document.getElementById("mobileDayHeading");
    const mobileEventCount = document.getElementById("mobileEventCount");
    const mobileEvents = document.getElementById("mobileEvents");
    mobileDays.innerHTML = days.map(([day], index) => `<button type="button" role="tab" id="mobile-day-${index}" class="${day === currentDay ? 'is-current' : ''}" aria-controls="mobileDayView" aria-label="${dayLabels[day]}" aria-selected="false" tabindex="-1">${day}</button>`).join("");
    const mobileDayTabs = Array.from(mobileDays.querySelectorAll('[role="tab"]'));

    function ShowMobileDay(index, moveFocus = false) {
      const [day, events] = days[index];
      const visibleEvents = events.filter(event => !["flex", "free"].includes(event.category));
      mobileDayTabs.forEach((tab, tabIndex) => {
        const selected = tabIndex === index;
        tab.setAttribute("aria-selected", String(selected));
        tab.classList.toggle("is-current", dayOrder[tabIndex] === currentDay);
        tab.tabIndex = selected ? 0 : -1;
      });
      mobileDayView.setAttribute("aria-labelledby", mobileDayTabs[index].id);
      mobileDayHeading.textContent = dayLabels[day];
      mobileEventCount.textContent = `${visibleEvents.length} scheduled events`;
      mobileEvents.innerHTML = visibleEvents.map(({ start, end, label, category }) => `<article class="mobile-event" style="--event-bg:var(--${category}-bg);--event-border:var(--${category}-bd);--event-fg:var(--${category}-fg)"><span class="mobile-event-time">${fmt(start)}&ndash;${fmt(end)}</span><span><strong class="mobile-event-name">${label}</strong><span class="mobile-event-category">${cats[category]}</span></span></article>`).join("");
      if (moveFocus) mobileDayTabs[index].focus();
    }

    mobileDayTabs.forEach((tab, index) => {
      tab.addEventListener("click", () => ShowMobileDay(index));
      tab.addEventListener("keydown", event => {
        let nextIndex;
        if (event.key === "ArrowRight" || event.key === "ArrowDown") nextIndex = (index + 1) % days.length;
        if (event.key === "ArrowLeft" || event.key === "ArrowUp") nextIndex = (index - 1 + days.length) % days.length;
        if (event.key === "Home") nextIndex = 0;
        if (event.key === "End") nextIndex = days.length - 1;
        if (nextIndex !== undefined) {
          event.preventDefault();
          ShowMobileDay(nextIndex, true);
        }
      });
    });
    ShowMobileDay(currentIndex);

    const total = (E - S) / 60 * H;
    let h = '<div class="hd"></div>' + days.map(d => `<div class="hd ${d[0] === currentDay ? 'is-current' : ''}">${d[0]}</div>`).join("");
    let t = '<div class="times" style="height:' + total + 'px">';
    for (let x = 6; x <= 22; x++) { t += `<span style="top:${(x - 6) * H}px">${fmt(x + ":00")}</span>` }
    h += t + "</div>";
    days.forEach(([day, evs]) => {
      h += `<div class="col" style="height:${total}px">` + evs.filter(event => !["flex", "free"].includes(event.category)).map(({ start, end, label, category }) => {
        const top = (m(start) - S) / 60 * H, ht = (m(end) - m(start)) / 60 * H;
        return `<div class="ev" style="top:${top}px;height:${ht - 2}px;background:var(--${category}-bg);border-color:var(--${category}-bd);color:var(--${category}-fg)"><b>${label}</b><i>${fmt(start)}&ndash;${fmt(end)}</i></div>`
      }).join("") + "</div>";
    });
    document.getElementById("grid").innerHTML = h;
  </script>
  <script src="../script.js"></script>
</body>

</html>
