<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>JStaed Resume</title>
	<link rel="stylesheet" href="../styles.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
	<a href="https://www.jstaed.me" class="homeButton" aria-label="Home"><i class="fa-sharp-duotone fa-solid fa-house" aria-hidden="true"></i></a>
	<button id="toggleDark" class="darkModeButton"><i class="fa-solid fa-sun"></i></button>
	<h1>Resume</h1>
	<main class="resume-content">
		<div class="resume-viewer">
			<iframe src="../Jane%20Staed%20Resume%202026.pdf" title="Jane Staed resume">
				<p>Your browser can't display the embedded PDF. <a href="../Jane%20Staed%20Resume%202026.pdf">Open the resume PDF</a>.</p>
			</iframe>
		</div>
		<p class="resume-actions"><a href="../Jane%20Staed%20Resume%202026.pdf" class="page-button" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>Open resume PDF</a></p>
	</main>
	<script src="../script.js"></script>
</body>
</html>
