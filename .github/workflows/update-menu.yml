name: Update PennWest menu data

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays, about 5:17 am Eastern
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the latest menus
        run: python tools/update_menu.py --out work/pennwest-menu/data.js
      - name: Commit and push if the menus changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/pennwest-menu/data.js
          if git diff --cached --quiet; then
            echo "Menu data is unchanged."
          else
            git commit -m "Update PennWest menu data"
            git push
          fi
