<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sample Weekly Schedule</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="schedule.css">
</head>

<body>
  <a href="https://www.jstaed.me" class="homeButton" aria-label="Home"><i class="fa-sharp-duotone fa-solid fa-house" aria-hidden="true"></i></a>
  <button id="toggleDark" class="darkModeButton"><i class="fa-solid fa-sun"></i></button>
  <main>
    <h1>Sample Weekly Schedule</h1>
    <p class="sub" id="scheduleSummary"></p>
    <div class="legend" id="legend"></div>
    <div class="mobile-schedule">
      <div class="mobile-days" id="mobileDays" role="tablist" aria-label="Choose a day"></div>
      <section id="mobileDayView" role="tabpanel" tabindex="0">
        <div class="mobile-day-heading">
          <h2 id="mobileDayHeading"></h2>
          <span id="mobileEventCount"></span>
        </div>
        <div class="mobile-events" id="mobileEvents"></div>
      </section>
    </div>
    <div class="wrap">
      <div class="grid" id="grid"></div>
    </div>
  </main>
  <script src="schedule.js"></script>
  <script src="../../script.js"></script>
</body>

</html>
